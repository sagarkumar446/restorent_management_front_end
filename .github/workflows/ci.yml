name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend - install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: CI=true npm test -- --watchAll=false --passWithNoTests

      - name: Build
        run: npm run build

  backend-build:
    name: Backend - install, test & package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_management_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: sagarkumar446/restorent_management_system
          path: backend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" &> /dev/null; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"; exit 1

      - name: Build & test backend
        working-directory: backend
        run: sh mvnw -B verify

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 3

  e2e:
    name: E2E - Playwright (frontend + backend)
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_management_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      E2E_API_BASE: http://localhost:8080/api
    steps:
      - uses: actions/checkout@v4

      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          java -jar backend-jar/*.jar \
            --spring.datasource.url="jdbc:mysql://127.0.0.1:3306/restaurant_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/customers/menu || true)
            if [ "$code" = "200" ]; then echo "Backend is up"; exit 0; fi
            sleep 5
          done
          echo "Backend failed to start"; tail -100 backend.log; exit 1

      - name: Seed database
        run: |
          mysql -h 127.0.0.1 -uroot -proot restaurant_management_system << 'SQL'
          INSERT INTO category (name, display_name, emoji) VALUES
            ('GRAINS', 'Grains & Main Course', '🍛'),
            ('SNACKS', 'Snacks & Starters', '🍟'),
            ('DESSERTS', 'Desserts', '🍰'),
            ('BEVERAGES', 'Beverages', '🥤')
          ON DUPLICATE KEY UPDATE name=name;
          INSERT INTO menu_item (item_name, description, price, category, veg, image) VALUES
            ('Margherita Pizza', 'Classic cheese and tomato', 12.99, 'SNACKS', 1, FROM_BASE64('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')),
            ('Chocolate Lava Cake', 'Warm molten chocolate cake', 8.50, 'DESSERTS', 1, FROM_BASE64('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')),
            ('Mango Lassi', 'Creamy mango yogurt drink', 4.99, 'BEVERAGES', 1, FROM_BASE64('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')),
            ('Chicken Tikka', 'Char-grilled spiced chicken', 10.99, 'GRAINS', 0, FROM_BASE64('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='));
          SQL

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          retention-days: 3
